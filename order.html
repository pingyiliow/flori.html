<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="description" content="Check your Bamboo Green Florist order, pay, and see it confirmed.">
<title>Confirm your order | Bamboo Green Florist</title>
<link rel="icon" href="/logo-green.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Display&family=Hanken+Grotesk:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Hallmark · redesign: full · scope: app · theme: loom (brand kept: ecru, ink green, Caslon, wordmark) · customer order page: details, pay, confirmed · signature: one card that is the order, carried from screen to screen · v2.0.0 */
/* critique: each screen answers one question (is this right, how do I pay, is it done) with one green button; details fold away, the rest drops to quiet rows */
/* Hallmark · dropped logo-green.png in the header · replaced by the wordmark the owner supplied (the icon stays the favicon) */
:root{
  --color-paper:#F3EFE6; --color-paper-2:#EBE5D8; --color-surface:#FAF8F3; --color-card:#FFFFFF; --color-accent-soft:#E3EAE5; --color-off:#E4DED2;
  --color-ink:#2A2622; --color-ink-2:#3F3A35; --color-muted:#6E665D; --color-rule:#D6CFC0;
  --color-accent:#2E4A3D; --color-accent-2:#3D5E4F; --color-accent-ink:#F3EFE6; --color-warn:#8A5A12; --color-req:#C0392B; --color-focus:#2E4A3D;
  --font-display:"Libre Caslon Display",Georgia,serif; --font-body:"Hanken Grotesk",system-ui,sans-serif; --font-num:"DM Mono",ui-monospace,monospace;
  --dur:140ms;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{overflow-x:clip}
::selection{background:var(--color-accent-soft)}
input,textarea{caret-color:var(--color-accent)}
body{font-family:var(--font-body);font-size:16px;color:var(--color-ink);background:var(--color-paper);-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--color-focus);outline-offset:2px}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums}
.wrap{max-width:520px;margin:0 auto;padding:0 20px 48px}
.top{display:flex;align-items:center;gap:12px;padding:16px 0;border-bottom:2px solid var(--color-ink)}
.top img{height:48px;width:auto}
.top .lang{margin-left:auto}
.lang{display:flex;box-shadow:inset 0 0 0 1px var(--color-rule)}
.lang button{padding:8px 12px;font-size:13px;font-weight:600;color:var(--color-muted);min-height:36px;transition:background-color var(--dur),color var(--dur)}
.lang button.on{background:var(--color-ink);color:var(--color-paper)}
h1{text-wrap:balance;font-family:var(--font-display);font-weight:400;font-size:36px;line-height:1.05;letter-spacing:-.01em;margin-top:28px;overflow-wrap:break-word;min-width:0}
.ref{margin-top:8px;font-size:14px;color:var(--color-muted)}
.sec{margin-top:28px}
.sec h2{font-size:15px;font-weight:600;padding-bottom:8px;border-bottom:2px solid var(--color-ink)}
.item{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--color-rule)}
.item img{width:64px;height:64px;object-fit:cover;flex:none;background:var(--color-paper-2);display:block}
.item .ph{flex:none;padding:0;border:0;background:none;cursor:zoom-in;align-self:flex-start}
.item .ph:focus-visible{outline:2px solid var(--color-accent);outline-offset:2px}
.thumbs{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.thumbs img{width:48px;height:48px}
.zoom{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:16px;background:color-mix(in oklab,var(--color-ink) 90%,transparent);cursor:zoom-out}
.zoom[hidden]{display:none}
.zoom img{max-width:100%;max-height:100%;object-fit:contain}
.item .t{flex:1;min-width:0}
.item .t b{display:block;font-weight:600;overflow-wrap:break-word}
.item .t small{display:block;margin-top:2px;font-size:13px;color:var(--color-muted)}
.item .t small.fn{margin-top:6px;color:var(--color-ink-2);white-space:pre-line;line-height:1.5}
.item .t small.fn .fl{display:block;color:var(--color-muted);font-size:12px}
.item .p{font-size:14px;white-space:nowrap}
.total{display:flex;justify-content:space-between;align-items:baseline;padding:12px 0}
.total span:first-child{color:var(--color-muted);font-size:14px}
.total b{font-family:var(--font-display);font-weight:400;font-size:28px}
.f{margin-top:16px}
.f label{display:block;font-size:13px;font-weight:500;color:var(--color-muted);margin-bottom:6px}
.f input,.f textarea{width:100%;min-height:48px;padding:12px;border:1px solid var(--color-rule);background:var(--color-surface);border-radius:0;font-size:16px;transition:border-color var(--dur)}
.f textarea{min-height:88px;resize:vertical;line-height:1.4}
.f textarea.grow{min-height:48px;resize:none;overflow:hidden}
.f select{width:100%;min-height:48px;padding:12px;border:1px solid var(--color-rule);background:var(--color-surface);border-radius:0;font-size:16px;color:inherit;font:inherit}
.f select:focus{border-color:var(--color-accent);outline:none;box-shadow:0 0 0 1px var(--color-accent)}
.f.bad select{border-color:var(--color-warn)}
.req{color:var(--color-req);margin-left:3px;font-weight:600}
.f input:focus,.f textarea:focus{border-color:var(--color-accent);outline:none;box-shadow:0 0 0 1px var(--color-accent)}
.f.bad input,.f.bad textarea{border-color:var(--color-warn)}
.f .err{display:none;margin-top:4px;font-size:13px;color:var(--color-warn);font-weight:600}
.f.bad .err{display:block}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
@media (max-width:480px){.two{grid-template-columns:minmax(0,1fr)}}
.seg{display:grid;grid-template-columns:1fr 1fr;box-shadow:inset 0 0 0 1px var(--color-rule)}
.seg button{min-height:48px;font-weight:600;color:var(--color-muted);transition:background-color var(--dur),color var(--dur)}
.seg button.on{background:var(--color-ink);color:var(--color-paper)}
.seg button[disabled]{cursor:not-allowed}
.seg.slot{grid-template-columns:repeat(auto-fit,minmax(0,1fr))}
.seg.slot button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:8px 6px;line-height:1.2}
.seg.slot small{font-size:12px;font-weight:500;opacity:.8}
.f.bad .seg{box-shadow:inset 0 0 0 1px var(--color-warn)}
.f .tick{display:flex;align-items:center;gap:8px;margin:10px 0 0;font-size:15px;color:var(--color-ink);cursor:pointer;min-height:36px}
.f .tick input{width:20px;height:20px;min-height:0;margin:0;accent-color:var(--color-accent)}
.f textarea:disabled{background:var(--color-off);color:var(--color-muted);cursor:not-allowed}
.iw{border-bottom:1px solid var(--color-rule);padding-bottom:14px}
.iw .item{border-bottom:0;padding-bottom:0}
.f.cardf{margin:12px 0 0}
.iw:has(.ph) .f.cardf{margin-left:76px}
.f.cardf textarea{min-height:64px}
.f.nocard{margin-top:8px}
.f.nocard .tick{margin-top:0}
.seg button[disabled]:not(.on){background:var(--color-off);color:var(--color-muted);cursor:not-allowed}
.addr{position:relative}
.hits{border:1px solid var(--color-rule);border-top:0;background:var(--color-surface)}
.hits:empty{display:none}
.hits button{display:block;width:100%;text-align:left;padding:12px;font-size:14px;border-top:1px solid var(--color-rule);min-height:44px}
.hits button:first-child{border-top:0}
.hits button:hover{background:var(--color-paper-2)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;margin-top:28px;background:var(--color-accent);color:var(--color-accent-ink);font-weight:600;font-size:16px;text-decoration:none;transition:background-color var(--dur)}
.btn:hover{background:var(--color-accent-2)}
.btn:active{transform:translateY(1px)}
.btn[disabled]{background:var(--color-off);color:var(--color-muted);cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--color-accent);box-shadow:inset 0 0 0 1.5px var(--color-accent);margin-top:12px}
.btn.ghost:hover{background:var(--color-paper-2)}
.fine{margin-top:12px;font-size:13px;color:var(--color-muted);text-align:center}
.note{margin-top:12px;font-size:15px;line-height:1.5;color:var(--color-ink-2)}
.bank{margin-top:16px;border-top:2px solid var(--color-ink)}
.bank .r{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--color-rule)}
.bank .r span{font-size:13px;color:var(--color-muted)}
.bank .r b{font-weight:600;text-align:right;flex:1}
.copy{font-size:13px;font-weight:600;color:var(--color-accent);padding:8px 0 8px 12px;min-height:36px}
.qr{margin-top:16px;display:flex;justify-content:center}
.qr img{display:block;width:220px;height:auto;border-radius:12px}
.cap a{color:var(--color-ink)}
.cap{text-align:center;font-size:13px;color:var(--color-muted);margin-top:8px}
.drop{display:block;margin-top:16px;border:1.5px dashed var(--color-rule);padding:20px;text-align:center;font-size:14px;color:var(--color-muted);background:var(--color-surface);cursor:pointer}
.drop b{display:block;color:var(--color-ink);font-weight:600;margin-bottom:4px}
.drop.ok{border-style:solid;border-color:var(--color-accent);color:var(--color-accent)}
.drop input{position:absolute;width:1px;height:1px;opacity:0}
.box{margin-top:16px;padding:12px 16px;background:var(--color-paper-2);font-size:15px;line-height:1.5}
.ro .r{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--color-rule);font-size:15px}
.ro .r span{color:var(--color-muted);font-size:13px;flex:none}
.ro .r b{font-weight:500;text-align:right;overflow-wrap:anywhere;white-space:pre-line}
.item .p.muted{color:var(--color-muted);white-space:normal;text-align:right}
.msg{margin-top:6px;font-size:13px;line-height:1.45;color:var(--color-warn);font-weight:600}
.msg:empty{display:none}
.msg a{color:inherit}
.msg.info{color:var(--color-ink-2);font-weight:500}
.toast{position:fixed;z-index:20;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--color-ink);color:var(--color-paper);padding:12px 16px;font-size:14px;opacity:0;pointer-events:none;transition:opacity var(--dur)}
.toast.on{opacity:1}
.steps{display:flex;gap:8px;margin-top:20px}
.steps span{flex:1;padding-top:6px;border-top:3px solid var(--color-rule);font-size:12px;color:var(--color-muted)}
.steps span.on{border-color:var(--color-accent);color:var(--color-ink);font-weight:600}
.steps span.past{border-color:var(--color-accent)}
.slots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.slots.pair{grid-template-columns:repeat(2,minmax(0,1fr))}
.slots button{min-height:44px;padding:8px 6px;border:1px solid var(--color-rule);background:var(--color-surface);font-size:14px;line-height:1.25;transition:background-color var(--dur),color var(--dur),border-color var(--dur)}
.slots button:hover{border-color:var(--color-ink-2)}
.slots button.on{background:var(--color-ink);color:var(--color-paper);border-color:var(--color-ink)}
.f.bad .slots button{border-color:var(--color-warn)}
.tnote{margin-top:6px;font-size:13px;line-height:1.45;color:var(--color-muted)}
.shop{margin-top:16px;padding:14px 16px;background:var(--color-surface);border:1px solid var(--color-rule)}
.shop span{display:block;font-size:13px;color:var(--color-muted)}
.shop b{display:block;font-weight:600;margin-top:4px}
.shop p{margin-top:4px;font-size:14px;line-height:1.5;color:var(--color-ink-2)}
.shop p.hrs{font-size:13px;color:var(--color-muted)}
.shop a{display:inline-flex;align-items:center;margin-top:10px;min-height:40px;padding:0 14px;border:1.5px solid var(--color-accent);color:var(--color-accent);font-weight:600;font-size:14px;text-decoration:none;transition:background-color var(--dur)}
.shop a:hover{background:var(--color-paper-2)}
.tick.sw{display:flex;align-items:center;gap:8px;margin-top:16px;font-size:15px;cursor:pointer;min-height:36px}
.tick.sw input{width:20px;height:20px;margin:0;accent-color:var(--color-accent)}
.bar{position:sticky;bottom:0;z-index:5;display:flex;align-items:center;gap:12px;margin:24px -20px 0;padding:12px 20px calc(12px + env(safe-area-inset-bottom));background:var(--color-surface);border-top:1px solid var(--color-rule)}
.bar .tt span{display:block;font-size:12px;color:var(--color-muted)}
.bar .tt b{display:block;font-family:var(--font-display);font-weight:400;font-size:24px;white-space:nowrap}
.bar .btn{width:auto;flex:1;max-width:260px;margin:0 0 0 auto;min-height:48px}
/* one card per question */
.card{margin-top:16px;background:var(--color-card);border:1px solid var(--color-rule);padding:4px 16px 16px}
.card > h2{font-size:15px;font-weight:600;padding-top:12px}
.card .iw:last-of-type{border-bottom:0}
.card .item:last-child{border-bottom:0}
.card .total{padding-bottom:0}
.card .shop{margin:12px 0 0}
.who{padding:12px 0 0;border-top:1px solid var(--color-rule);font-size:14px;line-height:1.5;color:var(--color-ink-2)}
.who b{font-weight:600;color:var(--color-ink)}
.total{gap:12px}
.pst{display:flex;justify-content:flex-end;margin:-4px 0 12px}
.tag{display:inline-block;padding:2px 8px;font-family:var(--font-body);font-size:12px;font-weight:600;color:var(--color-accent);background:var(--color-accent-soft);vertical-align:middle}
.tag.wait{color:var(--color-warn);background:var(--color-paper-2)}
details.fold{margin-top:12px;border-top:1px solid var(--color-rule)}
details.fold summary{display:flex;align-items:center;justify-content:space-between;min-height:44px;font-size:14px;font-weight:600;color:var(--color-accent);cursor:pointer;list-style:none}
details.fold summary::-webkit-details-marker{display:none}
details.fold summary svg{flex:none;transition:transform var(--dur)}
details.fold[open] summary svg{transform:rotate(180deg)}
details.fold .ro .r:last-child{border-bottom:0}
.link{display:inline-flex;align-items:center;min-height:44px;font-size:14px;font-weight:600;color:var(--color-accent);text-decoration:underline;text-underline-offset:3px}
.link:hover{color:var(--color-accent-2)}
button.link{padding:0}
.due{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-top:16px;padding:16px;background:var(--color-ink);color:var(--color-paper)}
.due span{font-size:14px}
.due b{font-family:var(--font-display);font-weight:400;font-size:34px;line-height:1}
.card .note{margin-top:8px;font-size:14px}
.card .seg{margin-top:12px}
.pane{margin-top:4px}
.card .bank{border-top:0;margin-top:4px}
.card .bank .r:last-child{border-bottom:0}
.card .drop{margin-top:12px}
.okmark{margin-top:24px;width:48px;height:48px;border-radius:50%;background:var(--color-accent);color:var(--color-accent-ink);display:grid;place-items:center}
.okmark + h1{margin-top:12px}
.more{margin-top:20px;border-top:1px solid var(--color-rule)}
.more a{display:flex;align-items:center;gap:12px;min-height:60px;border-bottom:1px solid var(--color-rule);text-decoration:none;color:var(--color-ink);font-size:15px;transition:background-color var(--dur)}
.more a:hover{background:var(--color-surface)}
.more .tx{flex:1;min-width:0}
.more .tx small{display:block;font-size:13px;color:var(--color-muted)}
.more svg{flex:none;color:var(--color-muted)}
.more svg.ic{color:var(--color-accent)}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

  <header class="top">

        + '<div class="two">'+field('contact',t('phone')+REQ,D.contact,'inputmode="tel" autocomplete="tel" class="num"')+field('email',t('email'),D.email,'type="email" autocomplete="email"')+'</div></div>'
      + '<div class="card"><h2>'+t('getting')+'</h2><div class="f"><div class="seg"><button type="button" data-fl="delivery" class="'+(pk?'':'on')+'"'+(D.paid?' disabled':'')+'>'+t('deliv')+'</button><button type="button" data-fl="pickup" class="'+(pk?'on':'')+'"'+(D.paid?' disabled':'')+'>'+t('pick')+'</button></div></div>'
        + (pk ? shopHtml() : '')
        + field('dueDate',(pk?t('pdate'):t('ddate'))+REQ,D.dueDate,'type="date" min="'+todayIso()+'"')+timeHtml(pk)
        + (pk ? field('collector',t('collector'),String(D.recipName||'').trim()===String(D.name||'').trim()?'':D.recipName,'autocomplete="off"')
          : '<div class="two">'+field('recipName',t('rname')+REQ,D.recipName,'')+field('recipPhone',t('rphone'),D.recipPhone,'inputmode="tel" class="num" placeholder="+60"')+'</div>'
          + field('recipCompany',t('company'),D.recipCompany,'autocomplete="organization"')
          + '<div class="f addr" id="w-addr"><label for="f-addr">'+t('addr')+REQ+'</label><textarea id="f-addr" class="grow" rows="1" autocomplete="off">'+esc(D.addr)+'</textarea><div class="hits" id="hits"></div><div class="err">'+t('need')+'</div><div class="msg'+(D.feeOut&&D.feeAuto?' info':'')+'" id="addr-msg">'+(D.feeOut&&D.feeAuto?outMsg():'')+'</div></div>'
          + field('deliveryInstr',t('instr'),D.deliveryInstr,'',true))
      + '</div>'
      + '<p class="fine">'+t('fine')+'</p>'
      + '<div class="bar"><div class="tt"><span>'+t('total')+'</span><b class="num" id="bar-total">'+totalNow()+'</b></div><button class="btn" type="button" id="go">'+(D.paid?t('savech'):t('confirm'))+'</button></div>';
    // Paid: delivery or pickup stays as paid for (the price would change).
    if (!D.paid) document.querySelectorAll('[data-fl]').forEach(b => b.onclick = () => { keep(); D.fulfil = b.dataset.fl;
      // A slot of the other list does not carry over (delivery sessions vs pickup hours).
      if (SLOTS.concat(PK_SLOTS).some(s => s[0]===D.dueTime)) D.dueTime = ''; render(); });
    document.getElementById('go').onclick = submit;
    const wireTime = () => { document.querySelectorAll('#w-dueTime [data-tv]').forEach(b => b.onclick = () => {
      D.dueTime = b.dataset.tv; const h = document.getElementById('f-dueTime'); if (h) h.value = D.dueTime;
      document.querySelectorAll('#w-dueTime [data-tv]').forEach(x => { const on = x===b; x.classList.toggle('on', on); x.setAttribute('aria-checked', on); });
      document.getElementById('w-dueTime').classList.remove('bad'); }); };
    wireTime();
    // A pickup date change re-lists the times (Sunday has mornings only); a time Sunday
    // does not have is cleared.
    const dd = document.getElementById('f-dueDate');
    if (dd && pk) dd.addEventListener('change', () => { D.dueDate = dd.value;
      if (isSun(dd.value) && PK_SLOTS.some(s => s[0]===D.dueTime) && !PK_SUN.includes(D.dueTime)) D.dueTime = '';
      const w = document.getElementById('w-dueTime'); if (w) { w.outerHTML = timeHtml(true); wireTime(); } });
    const nc = document.getElementById('f-noCard'), cs = [...document.querySelectorAll('.cardf textarea')];
    if (nc) nc.onchange = () => { if (nc.checked) D._cards = cs.map(x => x.value);
      cs.forEach((x,i) => { x.disabled = nc.checked; x.value = nc.checked ? '' : (D._cards[i]||''); x.closest('.f').classList.remove('bad'); }); };
    cs.forEach(x => x.addEventListener('input', () => { if (x.value.trim()) document.querySelectorAll('.cardf').forEach(w => w.classList.remove('bad')); }));
    const a = document.getElementById('f-addr'); if (a) { wireAddr(a); if (a.value.trim()) quoteFee(0); }
  }

  // Google address suggestions (through the server, only while this link is open)
  function wireAddr(input){
    const hits = document.getElementById('hits'); let timer = null, seq = 0;
    const grow = () => { input.style.height = 'auto'; input.style.height = (input.scrollHeight + 2) + 'px'; };
    requestAnimationFrame(grow);
    input.onkeydown = e => { if (e.key === 'Enter') e.preventDefault(); };
    input.oninput = () => { grow(); quoteFee(800); clearTimeout(timer); const q = input.value.trim(); if (q.length < 3) { hits.innerHTML=''; return; }
      timer = setTimeout(async () => { const my = ++seq; const r = await api({ mode:'form-addr', sub:'autocomplete', input:q, sessionToken:sess });
        if (my !== seq) return; const ps = (r.j && r.j.predictions) || [];
        hits.innerHTML = ps.map((p,i) => '<button type="button" data-i="'+i+'">'+esc(p.description)+'</button>').join('');
        hits.querySelectorAll('button').forEach(b => b.onclick = async () => { const p = ps[+b.dataset.i]; hits.innerHTML=''; input.value = p.description; grow();
          if (p.placeId) { const d = await api({ mode:'form-addr', sub:'place', placeId:p.placeId, sessionToken:sess }); if (d.j && d.j.address) input.value = d.j.address; sess = Math.random().toString(36).slice(2); } grow(); quoteFee(0); });
      }, 300); };
  }

  async function submit(){
    keep();
    const req = ['name','contact','dueDate','dueTime'].concat(fulfil==='pickup' ? [] : ['recipName','addr']);
    // A card message under at least one flower, unless none is needed.
    const cardBad = !D.noCard && !String(D.cardMsg||'').trim();
    let first = null; document.querySelectorAll('.cardf').forEach(w => { w.classList.toggle('bad', cardBad); if (cardBad && !first) first = w; });
    req.forEach(k => { const w = document.getElementById('w-'+k); const bad = !String(D[k]||'').trim(); if (w) w.classList.toggle('bad', bad); if (bad && !first) first = w; });
    if (first) { first.scrollIntoView({ block:'center' }); const i = first.querySelector('input:not([type=hidden]),textarea,[data-tv]'); if (i) i.focus(); return; }
    const addrStop = msg => { const w = document.getElementById('w-addr'); addrMsg(msg); if (w) w.scrollIntoView({ block:'center' }); };
    if (D.feeAuto && fulfil!=='pickup') {
      if (!/\b\d{5}\b/.test(D.addr||'')) { addrStop(esc(t('feePc'))); return; }
    }
    const go = document.getElementById('go'); go.disabled = true; go.textContent = t('saving');
    const rN = D.recipName, rP = fulfil==='pickup' ? '' : D.recipPhone;
    const r = await api({ mode:'form-save', fields:{ name:D.name, contact:D.contact, email:D.email, recipName:rN, recipPhone:rP, recipCompany:D.recipCompany, noCard:!!D.noCard, fulfil, dueDate:D.dueDate, dueTime:D.dueTime, addr:D.addr, deliveryInstr:D.deliveryInstr, cardMsg:D.cardMsg, custNote:D.custNote } });
    if (r.ok) { D = r.j; view = 'pay'; render(); window.scrollTo(0,0); return; }
    if (r.status===409) { await load(); return; }
    go.disabled = false; go.textContent = D.paid ? t('savech') : t('confirm');
    const e = r.j && r.j.error;
    if (e==='need_postcode') { addrStop(esc(t('feePc'))); return; }
    if (e==='missing') { await load(); toast(t('need')); return; }
    toast(t('err'));
  }

  // payment receipt: shrink on the phone, store it, link it to this order
  function shrink(file){ return new Promise((res, rej) => { const img = new Image(); const u = URL.createObjectURL(file);
    img.onload = () => { const m = 1600, k = Math.min(1, m/Math.max(img.width, img.height)); const c = document.createElement('canvas'); c.width = Math.round(img.width*k); c.height = Math.round(img.height*k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(u); res(c.toDataURL('image/jpeg', .85)); };
    img.onerror = () => { URL.revokeObjectURL(u); rej(new Error('image')); }; img.src = u; }); }
  async function upload(file){
    if (!file) return;
    const pdf = file.type === 'application/pdf' || /\.pdf$/i.test(file.name||'');
    if (pdf && file.size > 3*1024*1024) { toast(t('pdfBig')); return; }
    slipState = 'up'; render();
    try {
      // A photo is shrunk on the phone; a PDF goes as it is.
      const data = pdf ? await new Promise((res, rej) => { const rd = new FileReader(); rd.onload = () => res(String(rd.result||'').replace(/^data:[^;,]*;/, 'data:application/pdf;')); rd.onerror = rej; rd.readAsDataURL(file); })
                       : await shrink(file);
      const r = await fetch('/api/upload', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ data }) });
      const j = await r.json().catch(()=>({}));
      if (!r.ok || !j.url) throw new Error('upload');
      const s = await api({ mode:'form-slip', url:j.url }); if (!s.ok) throw new Error('slip');
      slipState = 'ok'; D.slip = true; render();
    } catch(_) { slipState = ''; render(); toast(t('upbad')); }
  }

  async function load(){
    if (!tok) { app.innerHTML = '<h1>'+t('h1bad')+'</h1><div class="box">'+t('bad')+'</div>'; return; }
    const r = await api({ mode:'form-get' });
    if (!r.ok) { app.innerHTML = '<h1>'+t('h1bad')+'</h1><div class="box">'+t('bad')+'</div><a class="btn" href="'+waLink('Hi, about my order request')+'" target="_blank" rel="noopener">'+t('wa2')+'</a>'; return; }
    // Complete orders open on the check-and-pay page; the customer need not confirm first.
    // Details missing (even when already paid): the form first; complete: check-and-pay.
    D = r.j; if (Array.isArray(D.holidays)) HOL = D.holidays; view = D.state==='locked' ? 'done' : (complete() ? 'pay' : 'form'); render();
  }
  // Photo viewer: tap a photo to see it whole; tap anywhere or press Escape to close.
  const zoom = document.getElementById('zoom');
  const zoomClose = () => { zoom.hidden = true; zoom.querySelector('img').removeAttribute('src'); };
  document.addEventListener('click', e => { const b = e.target.closest && e.target.closest('.ph');
    if (b) { zoom.querySelector('img').src = b.dataset.src; zoom.hidden = false; return; }
    if (!zoom.hidden && e.target.closest('#zoom')) zoomClose(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !zoom.hidden) zoomClose(); });
  setLang(lang); load();
})();
</script>
